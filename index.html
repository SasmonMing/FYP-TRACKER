<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FYP Tracker</title>
<style>
  :root {
    --bg: #ffffff; --bg2: #f4f4f4; --text: #0a0a0a; --text2: #6b6b6b;
    --border: #e2e2e2; --accent: #0a0a0a; --accent2: #eaeaea;
    --danger: #c0392b; --card: #ffffff;
  }
  :root[data-theme="dark"] {
    --bg: #121212; --bg2: #1e1e1e; --text: #f0f0f0; --text2: #9a9a9a;
    --border: #333333; --accent: #f0f0f0; --accent2: #2a2a2a;
    --danger: #e05d4c; --card: #1a1a1a;
  }
  body { transition: background .2s, color .2s; }
  * { box-sizing: border-box; }
  html,body{height:100%;}
  body {
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    font-size:16px;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  .tabs {
    display:flex; gap:8px; padding: 18px 20px 14px; overflow-x:auto;
    border-bottom:1px solid var(--border); background:var(--bg);
    position:sticky; top:env(safe-area-inset-top,0px); z-index:9;
    justify-content:center; max-width:1100px; margin:0 auto;
  }
  .tab {
    padding: 11px 20px; border-radius: 24px; font-size:15px; font-weight:500; white-space:nowrap;
    cursor:pointer; border:1.5px solid var(--border); background:var(--bg2); color:var(--text2);
    flex:0 1 auto; transition: all .15s;
  }
  .tab.active { background:var(--tabColor); color:#fff; border-color:var(--tabColor); }
  main { padding: 24px 24px 70px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 28px; margin:0 0 6px; }
  .sub { color:var(--text2); font-size:15px; margin-bottom:22px; }
  .card {
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px 20px; margin-bottom:14px;
  }
  .card h3 { margin:0 0 6px; font-size:17px; }
  .card .meta { color:var(--text2); font-size:13px; margin-bottom:10px; }
  .progress-bar { height:10px; background:var(--bg2); border-radius:6px; overflow:hidden; margin:8px 0; }
  .progress-fill { height:100%; background:var(--tabColor); transition:width .3s; }
  .stat-row { display:flex; gap:12px; flex-wrap:wrap; }
  .stat { flex:1; min-width:120px; background:var(--bg2); border-radius:12px; padding:12px 14px; }
  .stat .num { font-size:24px; font-weight:700; }
  .stat .lbl { font-size:12.5px; color:var(--text2); }

  .cycle-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; margin-bottom:14px; }
  .cycle-card { border:1px solid var(--border); border-radius:14px; padding:16px; background:var(--bg2); }
  .cycle-card .pct { font-size:26px; font-weight:700; }
  .cycle-card .name { font-size:13px; color:var(--text2); margin-top:2px; font-weight:600; }

  .block-grid {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:14px;
  }
  .block {
    position:relative; border:1.5px solid var(--border); border-radius:14px;
    padding:18px 16px 16px; min-height:106px; background:var(--bg2); cursor:pointer;
    display:flex; flex-direction:column; justify-content:space-between; gap:10px;
    transition:border-color .15s, background .15s, color .15s;
  }
  .block:hover { border-color:var(--tabColor); }
  .block.done { background:var(--tabColor); border-color:var(--tabColor); color:#fff; }
  .block .txt { font-size:14.5px; font-weight:700; line-height:1.35; }
  .block.done .txt { color:#fff; }
  .block .check {
    width:20px; height:20px; border-radius:6px; border:1.5px solid var(--border);
    background:var(--bg); flex-shrink:0; display:flex; align-items:center; justify-content:center;
    align-self:flex-end;
  }
  .block.done .check { background:#fff; border-color:#fff; color:var(--tabColor); font-size:13px; font-weight:bold; }
  .block .delbtn {
    position:absolute; top:8px; right:10px; background:none; border:none; color:var(--text2);
    font-size:17px; cursor:pointer; line-height:1; padding:2px;
  }
  .block.done .delbtn { color:rgba(255,255,255,.75); }
  .block .delbtn:hover { color:var(--danger); }
  .block[draggable="true"] { cursor:grab; }
  .block.dragging { opacity:.4; }
  .block.drag-over { border-color:var(--tabColor); border-style:dashed; }
  .note-block { cursor:default; min-height:auto; }
  .note-block.editing { border-color:var(--tabColor); border-style:dashed; }
  .note-block .txt { font-weight:400; max-height:160px; overflow-y:auto; }
  .note-edit-btn {
    align-self:flex-end; padding:6px 12px; font-size:12.5px; font-weight:600;
    background:var(--bg); color:var(--tabColor); border:1.5px solid var(--tabColor);
  }
  .lit-link {
    display:block; font-size:12px; margin-top:4px; color:var(--tabColor);
    text-decoration:underline; word-break:break-all;
  }
  .note-block.editing .lit-link { color:#fff; text-decoration-color:rgba(255,255,255,.6); }

  .lit-filter-row { display:flex; gap:8px; flex-wrap:wrap; margin:14px 0 4px; }
  .lit-filter-chip {
    padding:6px 12px; border-radius:16px; font-size:12px; font-weight:600;
    background:var(--bg2); color:var(--text2); border:1.5px solid var(--border); cursor:pointer;
  }
  .lit-filter-chip.active { background:var(--chipColor); color:#fff; border-color:var(--chipColor); }
  .lit-badge {
    display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:10px;
    background:var(--chipColor); color:#fff; margin-bottom:6px; align-self:flex-start;
  }
  .note-block.editing .lit-badge { background:rgba(255,255,255,.25); }

  .cat-heading {
    font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    color:var(--tabColor); margin:20px 0 10px;
  }
  .cat-heading:first-child { margin-top:2px; }

  .shop-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:680px) { .shop-grid { grid-template-columns:1fr; } }
  .shop-item {
    border:1.5px solid var(--border); border-radius:14px; padding:14px 16px;
    background:var(--bg2); transition:border-color .15s, background .15s;
  }
  .shop-item.sourced { border-color:var(--tabColor); background:var(--tabColor); color:#fff; }
  .shop-top { display:flex; align-items:flex-start; gap:10px; }
  .shop-check {
    width:22px; height:22px; border-radius:6px; border:1.5px solid var(--border); background:var(--bg);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:13px; font-weight:bold;
    margin-top:1px;
  }
  .shop-item.sourced .shop-check { background:#fff; color:var(--tabColor); border-color:#fff; }
  .shop-txt { flex:1; font-size:14.5px; font-weight:700; line-height:1.4; }
  .shop-item.sourced .shop-txt { color:#fff; }
  .shop-item input[type=text],.shop-item input[type=number] {
    background:var(--bg); color:var(--text);
  }
  .shop-item.sourced input[type=text],.shop-item.sourced input[type=number] {
    background:rgba(255,255,255,.92); color:#111; border-color:transparent;
  }
  .del { color:var(--danger); cursor:pointer; font-size:18px; flex-shrink:0; background:none; border:none; padding:0 4px; }
  .shop-item.sourced .del { color:#fff; opacity:.85; }

  table { width:100%; border-collapse:collapse; font-size:14.5px; }
  th,td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--border); }
  th { color:var(--text2); font-weight:600; font-size:13px; }
  td:first-child { font-weight:600; }
  input[type=text],input[type=number],textarea,select {
    width:100%; padding:9px 12px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg2); color:var(--text); font-size:14.5px; font-family:inherit;
  }
  textarea { min-height:70px; resize:vertical; }
  .row { display:flex; gap:8px; margin-bottom:8px; }
  .row > * { flex:1; }
  button {
    padding:10px 16px; border-radius:9px; border:1px solid var(--tabColor); background:var(--tabColor);
    color:#fff; font-size:14.5px; font-weight:600; cursor:pointer;
  }
  .empty { color:var(--text2); font-size:14.5px; padding:16px 0; text-align:center; }

  .theme-toggle {
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 16px); left:18px; z-index:20;
    background:var(--bg2); color:var(--text); border:1.5px solid var(--border);
    border-radius:16px; padding:10px 14px; font-size:16px; cursor:pointer;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
  }

  .floating-badge {
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 16px); right:18px;
    background:var(--text); color:var(--bg); z-index:20;
    padding:12px 18px; border-radius:16px; text-align:right;
    box-shadow:0 4px 16px rgba(0,0,0,.18); cursor:grab; user-select:none;
    touch-action:none;
  }
  .floating-badge.dragging { cursor:grabbing; opacity:.85; }
  .floating-badge .pctnum { font-size:24px; font-weight:800; line-height:1; }
  .floating-badge .pctlabel { font-size:11px; opacity:.75; margin-top:2px; }
  .floating-badge .datenote { font-size:11.5px; opacity:.85; margin-top:6px; border-top:1px solid rgba(255,255,255,.25); padding-top:6px; }

  .week-tracker {
    position:sticky; top:calc(env(safe-area-inset-top,0px) + 72px); z-index:8;
    background:var(--bg); border:1px solid var(--border); border-radius:14px;
    padding:14px 16px; margin-bottom:16px;
  }
  .week-tracker .wt-label { font-size:14px; font-weight:700; margin-bottom:8px; }
  .week-segs { display:grid; grid-template-columns:repeat(14,1fr); gap:4px; height:16px; }
  .week-seg { background:var(--bg2); border-radius:4px; overflow:hidden; position:relative; }
  .week-seg .fill { position:absolute; left:0; top:0; bottom:0; background:var(--tabColor); }
  .week-nums { display:grid; grid-template-columns:repeat(14,1fr); gap:4px; margin-top:4px; }
  .week-nums span { font-size:9.5px; color:var(--text2); text-align:center; }
  .week-dates { display:grid; grid-template-columns:repeat(14,1fr); gap:4px; margin-top:2px; }
  .week-dates span { font-size:9px; color:var(--text2); text-align:center; opacity:.75; }

  .gantt-edit-rows { display:flex; flex-direction:column; gap:8px; }
  .gantt-edit-row { display:flex; gap:8px; align-items:center; }

  .calc-glossary { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:10px; margin-bottom:16px; }
  .glossary-card {
    position:relative; border:1px solid var(--border); border-radius:12px; padding:10px 32px 10px 14px; background:var(--bg2);
  }
  .glossary-card .glossary-label { font-weight:600; font-size:13.5px; }
  .glossary-card .glossary-value { margin-top:8px; font-size:20px; font-weight:800; color:var(--tabColor); }
  .glossary-card .del { position:absolute; top:6px; right:8px; }
  .glossary-add-row { display:flex; gap:8px; margin-bottom:16px; }

  .calc-toolbar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .calc-toolbar button {
    padding:7px 12px; font-size:13px; background:var(--bg2); color:var(--text); border:1px solid var(--border);
  }
  .calc-toolbar button:hover { border-color:var(--tabColor); color:var(--tabColor); }

  .calc-doc {
    border:1px solid var(--border); border-radius:14px; padding:28px 32px; background:var(--card);
    min-height:400px; font-size:15px; line-height:1.75; outline:none;
  }
  .calc-doc h2 { font-size:18px; margin:22px 0 10px; border-bottom:2px solid var(--tabColor); padding-bottom:6px; }
  .calc-doc h2:first-child { margin-top:0; }
  .calc-doc hr { border:none; border-top:1px solid var(--border); margin:22px 0; }
  .calc-doc .eq-block {
    font-family: Cambria, Georgia, 'Times New Roman', serif; background:var(--bg2);
    border:1px solid var(--border); border-radius:8px; padding:12px 18px; margin:8px 0; font-size:16px;
  }
  .calc-doc p { margin:8px 0; }

  .gantt-grid { display:grid; grid-template-columns:220px repeat(14,1fr); align-items:center; overflow-x:auto; }
  .gantt-grid .gh { font-size:11px; color:var(--text2); text-align:center; padding:6px 0; border-bottom:1px solid var(--border); }
  .gantt-grid .gh.current { color:var(--tabColor); font-weight:700; }
  .gantt-task-name { font-size:13.5px; font-weight:700; padding:8px 8px 8px 0; border-bottom:1px solid var(--border); }
  .gantt-cell { height:32px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
  .gantt-cell.current-col { background:var(--bg2); }
  .gantt-bar { width:78%; height:16px; border-radius:4px; background:var(--tabColor); }
</style>
</head>
<body>

<button type="button" class="theme-toggle" id="themeToggle">&#9788;</button>

<div class="floating-badge" id="floatBadge">
  <div class="pctnum" id="floatPct">0%</div>
  <div class="pctlabel">overall progress</div>
  <div class="datenote" id="floatDate"></div>
</div>

<div class="floating-badge" id="floatDates" style="left:18px; right:auto; text-align:left; top:calc(env(safe-area-inset-top,0px) + 76px);">
  <div id="datesContent"></div>
</div>

<div class="tabs" id="tabs"></div>
<main id="main"></main>

<script>
const TAB_COLORS = {
  "Overview": "#0a0a0a",
  "Phase 1": "#2563eb",
  "Phase 2": "#dc2626",
  "Shopping List": "#16a34a",
  "Budget": "#ea580c",
  "Gantt": "#0891b2",
  "Calculations": "#4338ca",
  "Literature": "#0d9488",
  "Notes": "#7c3aed",
};
const TABS = Object.keys(TAB_COLORS);

const CATS = ["Planning & Design","Hardware Development","Software Development","Integration & Testing","Finalization"];
const CAT_COLORS = {
  "Planning & Design": "#2563eb",
  "Hardware Development": "#d97706",
  "Software Development": "#7c3aed",
  "Integration & Testing": "#16a34a",
  "Finalization": "#dc2626",
};

const LIT_CATEGORIES = [
  "Manual Wheelchair Limitations and Physical Demands",
  "Manual Wheelchair Safety and Slope-Related Challenges",
  "Powered Wheelchair Affordability and Accessibility",
  "Existing Retrofit and Power-Assist Systems",
  "Motor Drive and Control System Design",
];
const LIT_CAT_COLORS = {
  [LIT_CATEGORIES[0]]: "#0d9488",
  [LIT_CATEGORIES[1]]: "#dc2626",
  [LIT_CATEGORIES[2]]: "#d97706",
  [LIT_CATEGORIES[3]]: "#2563eb",
  [LIT_CATEGORIES[4]]: "#7c3aed",
};
let litFilter = 'All';

let state = null;
let activeTab = "Overview";

const defaultState = () => ({
  phase1: [
    {t:"Topic selection and title finalisation", done:true, cat:"Planning & Design"},
    {t:"Chapter 1 - Intro, problem statement, aim/objectives", done:true, cat:"Planning & Design"},
    {t:"Literature search and source collection (40+ refs)", done:true, cat:"Planning & Design"},
    {t:"Chapter 2 - Literature review tables and synthesis", done:true, cat:"Planning & Design"},
    {t:"Component investigation and trade-off comparison (3.2)", done:true, cat:"Planning & Design"},
    {t:"Engineering assumptions, specs, calculations (3.4)", done:true, cat:"Planning & Design"},
    {t:"SolidWorks 2D/3D design sketches", done:false, cat:"Planning & Design"},
    {t:"Professional practices, cost analysis, compilation", done:true, cat:"Planning & Design"},
  ],
  phase2: [
    {t:"Purchase all components from finalised Shopping List", done:false, cat:"Hardware Development"},
    {t:"Verify received parts against datasheet specs (voltage, RPM, torque)", done:false, cat:"Hardware Development"},
    {t:"Finalise CAD drawing of drive roller pivot arm in SolidWorks", done:false, cat:"Planning & Design"},
    {t:"Machine drive roller to 60mm diameter with rubber coating", done:false, cat:"Hardware Development"},
    {t:"Cut and drill aluminium flat bar for pivot arm and clamp bracket", done:false, cat:"Hardware Development"},
    {t:"Assemble pivot arm with spring anchor points", done:false, cat:"Hardware Development"},
    {t:"Mount motor to pivot arm and verify shaft alignment with roller", done:false, cat:"Hardware Development"},
    {t:"Test-fit clamp bracket on wheelchair frame tube, adjust for diameter", done:false, cat:"Hardware Development"},
    {t:"Compress engagement spring to calculated distance, verify contact force", done:false, cat:"Hardware Development"},
    {t:"Set up ESP32-S3 dev environment (Arduino IDE + board package)", done:false, cat:"Software Development"},
    {t:"Write and test open-loop PWM motor script (no joystick yet)", done:false, cat:"Software Development"},
    {t:"Implement joystick ADC reading and calibrate centre deadband", done:false, cat:"Software Development"},
    {t:"Implement differential drive mixing (throttle + turn to L/R speed)", done:false, cat:"Software Development"},
    {t:"Add PWM ramping/smoothing to prevent jerky acceleration", done:false, cat:"Software Development"},
    {t:"Wire and test hardware emergency stop, independent of firmware", done:false, cat:"Software Development"},
    {t:"Assemble full wiring harness (battery, fuse, converter, drivers, ESP32)", done:false, cat:"Integration & Testing"},
    {t:"Bench test each motor driver individually before full integration", done:false, cat:"Integration & Testing"},
    {t:"Run flat-ground drive test, measure speed against 1.0 m/s target", done:false, cat:"Integration & Testing"},
    {t:"Run incline test up to 10°, record current draw and roller slip", done:false, cat:"Integration & Testing"},
    {t:"Adjust spring tension or roller if slip observed under load", done:false, cat:"Integration & Testing"},
    {t:"Document test results against Chapter 1 success metrics", done:false, cat:"Finalization"},
    {t:"Capture final photos/video of the working prototype", done:false, cat:"Finalization"},
    {t:"Compile Phase 2 report and prepare for submission", done:false, cat:"Finalization"},
  ],
  shopping: [
    {t:"DC Geared Motor — MY1016Z3, 24V, 150W, ~318-324 RPM output, continuous duty", qty:2, link:"", price:""},
    {t:"Motor Driver — IBT-4 (BTS7960-type), dual H-bridge, 30V / 43A peak", qty:2, link:"", price:""},
    {t:"Microcontroller — ESP32-S3 DevKitC-1, USB-C, breakout GPIO", qty:1, link:"", price:""},
    {t:"Joystick Module — 2-axis analog, PS2-style breakout, 5V", qty:1, link:"", price:""},
    {t:"Emergency Stop Button — 22mm panel mount, normally-closed (NC)", qty:1, link:"", price:""},
    {t:"Battery — 12V Sealed Lead-Acid (SLA), 7Ah (2x in series for 24V)", qty:2, link:"", price:""},
    {t:"Inline Fuse Holder + 40A Automotive Blade Fuse", qty:1, link:"", price:""},
    {t:"Buck Converter — 24V to 5V step-down, min 2A output", qty:1, link:"", price:""},
    {t:"Drive Roller Stock — 60mm diameter, rubber-coated wheel/caster", qty:2, link:"", price:""},
    {t:"Heavy Gauge Wire — 14-16 AWG, red + black, for battery/motor lines", qty:1, link:"", price:""},
    {t:"Signal Gauge Wire — 22-24 AWG, assorted colours, for PWM/joystick lines", qty:1, link:"", price:""},
    {t:"Ring Terminal Connectors — sized to SLA battery terminals", qty:1, link:"", price:""},
    {t:"Prototyping Perfboard or Small Project Enclosure Box", qty:1, link:"", price:""},
    {t:"Cable Ties + Strain Relief Grommets, assorted sizes", qty:1, link:"", price:""},
  ],
  budget: [],
  notes: [],
  literature: [],
  calcDoc: `<h2>3.4.1 Design Assumptions</h2>
<p>Combined user + wheelchair mass: <b>100 kg</b><br>
Target maximum slope angle: <b>10&deg;</b><br>
Coefficient of static friction (rubber roller on tyre): <b>&mu; = 0.7</b><br>
Rolling resistance coefficient: <b>C<sub>rr</sub> = 0.02</b><br>
Rear wheel radius: <b>r&#8321; = 0.305 m</b> (24-inch wheel)<br>
Drive roller diameter: <b>60 mm</b> (r&#8322; = 0.030 m)<br>
Target flat-ground speed: <b>v = 1.0 m/s</b><br>
Friction-drive transmission efficiency: <b>&eta; = 75%</b><br>
Propulsion safety factor: <b>SF<sub>p</sub> = 1.5</b></p>

<hr>

<h2>Step 1 &mdash; Tractive Force on an Incline</h2>
<div class="eq-block">F<sub>rr</sub> = C<sub>rr</sub> &middot; m &middot; g &middot; cos(&theta;) = 0.02 &times; 100 &times; 9.81 &times; cos(10&deg;) &asymp; <b>19.32 N</b></div>
<div class="eq-block">F<sub>g</sub> = m &middot; g &middot; sin(&theta;) = 100 &times; 9.81 &times; sin(10&deg;) &asymp; <b>170.35 N</b></div>
<div class="eq-block">F<sub>total</sub> = F<sub>rr</sub> + F<sub>g</sub> = 19.32 + 170.35 = <b>189.67 N</b></div>

<hr>

<h2>Step 2 &mdash; Mechanical Power Requirement</h2>
<div class="eq-block">P<sub>raw</sub> = F<sub>total</sub> &times; v = 189.67 &times; 1.0 = <b>189.67 W</b></div>
<div class="eq-block">P<sub>motor_total</sub> = P<sub>raw</sub> / &eta; = 189.67 / 0.75 &asymp; <b>252.89 W</b></div>
<p>Two 150W motors give 300W total continuous capacity &rarr; <b>18% power margin</b> above requirement.</p>

<hr>

<h2>Step 3 &mdash; Required Motor Speed (Kinematic Matching)</h2>
<div class="eq-block">&omega; = v / r&#8322; = 1.0 / 0.030 = <b>33.33 rad/s</b></div>
<div class="eq-block">RPM = &omega; &times; (60 / 2&pi;) &asymp; <b>318 RPM</b></div>
<p>Matches the MY1016Z3's standard gearbox output (~300&ndash;324 RPM at 24V) &mdash; confirms viability of the 60mm roller.</p>

<hr>

<h2>Step 4 &mdash; Required Motor Torque</h2>
<div class="eq-block">F<sub>wheel</sub> = F<sub>total</sub> / 2 = 189.67 / 2 = <b>94.83 N per wheel</b></div>
<div class="eq-block">&tau;<sub>roller</sub> = (F<sub>wheel</sub> &times; SF<sub>p</sub> &times; r&#8322;) / &eta; = (94.83 &times; 1.5 &times; 0.030) / 0.75 &asymp; <b>5.69 Nm</b></div>

const JSONBIN_URL = 'https://api.jsonbin.io/v3/b/' + JSONBIN_ID;

async function load() {
  try {
    const res = await fetch(JSONBIN_URL + '/latest', {
      headers: { 'X-Access-Key': JSONBIN_KEY }
    });
    if (!res.ok) throw new Error('JSONBin read failed: ' + res.status);
    const data = await res.json();
    const record = data.record;
    state = (record && !record.placeholder) ? record : defaultState();
    try { localStorage.setItem('fyp-tracker-state', JSON.stringify(state)); } catch (e) {}
  } catch (e) {
    console.error('JSONBin load failed, using local backup:', e);
    try {
      const raw = localStorage.getItem('fyp-tracker-state');
      state = raw ? JSON.parse(raw) : defaultState();
    } catch (e2) {
      state = defaultState();
    }
  }
  if (!state.ganttStart) {
    state.ganttStart = new Date().toISOString().slice(0,10);
  }
  if (typeof state.notes === 'string') {
    state.notes = state.notes.trim() ? [{id: Date.now(), text: state.notes}] : [];
  }
  if (!state.badgePos) { state.badgePos = null; }
  if (!state.datesPos) { state.datesPos = null; }
  if (typeof state.datesCollapsed !== 'boolean') { state.datesCollapsed = false; }
  if (!state.theme) { state.theme = 'light'; }
  if (!state.ganttTasks) { state.ganttTasks = JSON.parse(JSON.stringify(GANTT_TASKS)); }
  if (typeof state.calcDoc !== 'string') { state.calcDoc = defaultState().calcDoc; }
  if (!Array.isArray(state.calcGlossary)) { state.calcGlossary = defaultState().calcGlossary; }
  if (!Array.isArray(state.literature)) { state.literature = []; }
  state.literature = state.literature.map(item =>
    item.name !== undefined ? item : { id: item.id, name: item.text || '', link: item.link || '' }
  );
  state.literature.forEach(item => { if (typeof item.category !== 'string') item.category = ''; });
  render();
  setupDraggable('floatBadge', 'badgePos');
  setupDraggable('floatDates', 'datesPos');
  renderDatesPanel();
  applyTheme();
  setupThemeToggle();
  save();
}

let saveQueued = false;

async function save() {
  try { localStorage.setItem('fyp-tracker-state', JSON.stringify(state)); } catch (e) {}

  if (saveInFlight) { saveQueued = true; return; }
  saveInFlight = doSave();
  await saveInFlight;
  saveInFlight = null;
  if (saveQueued) { saveQueued = false; save(); }
}

async function doSave() {
  try {
    const res = await fetch(JSONBIN_URL, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Access-Key': JSONBIN_KEY },
      body: JSON.stringify(state)
    });
    if (!res.ok) throw new Error('JSONBin write failed: ' + res.status);
  } catch (e) {
    console.error('JSONBin save failed (saved locally only):', e);
  }
}

function getWeekInfo() {
  const start = new Date(state.ganttStart + 'T00:00:00');
  const today = new Date();
  today.setHours(0,0,0,0);
  const daysSince = Math.max(0, Math.floor((today - start) / 86400000));
  const weekIndex = Math.min(13, Math.floor(daysSince / 7));
  const dayInWeek = daysSince % 7;
  const fillFrac = Math.min(1, (dayInWeek + 1) / 7);
  return { weekIndex, dayInWeek, fillFrac, daysSince };
}

let ganttEditMode = false;

function weekMondayDate(weekIndex) {
  const start = new Date(state.ganttStart + 'T00:00:00');
  const d = new Date(start.getTime() + weekIndex*7*86400000);
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short' });
}

function ganttView() {
  const { weekIndex, dayInWeek, fillFrac } = getWeekInfo();
  const segs = Array.from({length:14}, (_,i) => {
    let width = 0;
    if (i < weekIndex) width = 100;
    else if (i === weekIndex) width = fillFrac * 100;
    return `<div class="week-seg"><div class="fill" style="width:${width}%"></div></div>`;
  }).join('');
  const nums = Array.from({length:14}, (_,i) => `<span>${i+1}</span>`).join('');
  const dates = Array.from({length:14}, (_,i) => `<span>${weekMondayDate(i)}</span>`).join('');

  const headers = Array.from({length:14}, (_,i) => `<div class="gh ${i===weekIndex?'current':''}">W${i+1}</div>`).join('');

  let bodyHtml;
  if (!ganttEditMode) {
    const rows = state.ganttTasks.map(task => {
      const cells = Array.from({length:14}, (_,i) => {
        const wk = i+1;
        const inRange = wk >= task.start && wk <= task.end;
        const isCurrent = i === weekIndex;
        return `<div class="gantt-cell ${isCurrent?'current-col':''}">${inRange ? '<div class="gantt-bar"></div>' : ''}</div>`;
      }).join('');
      return `<div class="gantt-task-name">${task.name}</div>${cells}`;
    }).join('');
    bodyHtml = `
      <div class="gantt-grid" style="--tabColor:${TAB_COLORS['Gantt']}">
        <div class="gh"></div>${headers}
        ${rows}
      </div>
    `;
  } else {
    bodyHtml = `
      <div class="gantt-edit-rows">
        ${state.ganttTasks.map((task,i) => `
          <div class="gantt-edit-row">
            <input type="text" value="${task.name.replace(/"/g,'&quot;')}" data-gname="${i}" style="flex:2;">
            <input type="number" min="1" max="14" value="${task.start}" data-gstart="${i}" style="max-width:70px;">
            <input type="number" min="1" max="14" value="${task.end}" data-gend="${i}" style="max-width:70px;">
            <button type="button" class="del" data-gdel="${i}" style="flex:0 0 auto;">&times;</button>
          </div>
        `).join('')}
      </div>
      <div class="row" style="margin-top:10px;">
        <button type="button" id="gantt-add-task" style="flex:0 0 auto;">+ Add task</button>
      </div>
      <div class="row" style="margin-top:14px; align-items:center;">
        <label style="flex:0 0 auto; font-size:13.5px; font-weight:600;">Phase 2 start date (corrects the week/day tracker above):</label>
        <input type="date" id="gantt-start-input" value="${state.ganttStart}" style="max-width:180px;">
      </div>
    `;
  }

  return `
    <div style="display:flex; align-items:center; justify-content:space-between; gap:10px; margin:4px 0 14px;">
      <h3 style="margin:0;">Phase 2 Gantt Chart — 14 Weeks</h3>
      <button type="button" id="gantt-edit-toggle" style="flex:0 0 auto; ${ganttEditMode ? '' : 'background:transparent;color:var(--tabColor);'}">${ganttEditMode ? 'Done editing' : 'Edit chart'}</button>

      <div class="wt-label">Week ${weekIndex+1} of 14 &middot; Day ${dayInWeek+1} of this week</div>
      <div class="week-segs">${segs}</div>
      <div class="week-nums">${nums}</div>
      <div class="week-dates">${dates}</div>
    </div>
    <div class="card">

  const dateStr = today.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' });
  const { weekIndex } = getWeekInfo();
  document.getElementById('floatDate').textContent = dateStr + ' \u00B7 Wk ' + (weekIndex+1) + '/14';
}

function renderDatesPanel() {
  const el = document.getElementById('datesContent');
  if (!el) return;
  const { weekIndex } = getWeekInfo();
  const currentWeek = weekIndex + 1;
  if (state.datesCollapsed) {
    el.innerHTML = `
      <div style="display:flex; align-items:center; gap:8px; cursor:pointer;" id="datesToggleBtn">
        <span style="font-weight:700; font-size:12px;">Key Dates</span>
        <span style="font-size:11px; opacity:.8;">&middot; Wk ${currentWeek}</span>
        <span style="font-size:10px; opacity:.6;">&#9660;</span>
      </div>
    `;
  } else {
    el.innerHTML = `
      <div style="display:flex; align-items:center; justify-content:space-between; gap:14px; cursor:pointer;" id="datesToggleBtn">
        <span style="font-weight:700; font-size:12px; opacity:.9;">Key Dates &middot; Currently Wk ${currentWeek}</span>
        <span style="font-size:10px; opacity:.6;">&#9650;</span>
      </div>
      <div style="font-size:11.5px; line-height:1.7; margin-top:8px;">
        Wk 4 &mdash; In-progress Presentation 1<br>
        Wk 9 &mdash; In-progress Presentation 2<br>
        Wk 12 &mdash; Hand in FYP report<br>
        Wk 13 &mdash; Poster presentation<br>
        Wk 14 &mdash; Final VIVA presentation
      </div>
    `;
  }
  const toggleBtn = document.getElementById('datesToggleBtn');
  if (toggleBtn) toggleBtn.onclick = () => {
    state.datesCollapsed = !state.datesCollapsed;
    save();
    renderDatesPanel();
  };
}

function applyTheme() {
  document.documentElement.setAttribute('data-theme', state.theme === 'dark' ? 'dark' : 'light');
  const btn = document.getElementById('themeToggle');
  if (btn) btn.innerHTML = state.theme === 'dark' ? '&#9728;' : '&#9788;';
}

function setupThemeToggle() {
  const btn = document.getElementById('themeToggle');
  if (!btn || btn.dataset.setup) return;
  btn.dataset.setup = '1';
  btn.onclick = () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    applyTheme();
    save();
  };
}

function setupDraggable(elId, posKey) {
  const el = document.getElementById(elId);
  if (!el || el.dataset.dragSetup) return;
  el.dataset.dragSetup = '1';

  if (state[posKey]) {
    el.style.top = state[posKey].top + 'px';
    el.style.left = state[posKey].left + 'px';
    el.style.right = 'auto';
  }

  let offsetX = 0, offsetY = 0, dragging = false;

  const onDown = (clientX, clientY) => {
    const rect = el.getBoundingClientRect();
    offsetX = clientX - rect.left;
    offsetY = clientY - rect.top;
    dragging = true;
    el.classList.add('dragging');
    el.style.right = 'auto';
  };
  const onMove = (clientX, clientY) => {
    if (!dragging) return;
    let left = clientX - offsetX;
    let top = clientY - offsetY;
    const maxLeft = window.innerWidth - el.offsetWidth - 4;
    const maxTop = window.innerHeight - el.offsetHeight - 4;
    left = Math.max(4, Math.min(left, maxLeft));
    top = Math.max(4, Math.min(top, maxTop));
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  };
  const onUp = () => {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    state[posKey] = { left: parseFloat(el.style.left), top: parseFloat(el.style.top) };
    save();
  };

  el.addEventListener('mousedown', (e) => { onDown(e.clientX, e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove', (e) => onMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', onUp);

  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0]; onDown(t.clientX, t.clientY);
  }, { passive:true });
  window.addEventListener('touchmove', (e) => {
    if (!dragging) return;
    const t = e.touches[0]; onMove(t.clientX, t.clientY);
  }, { passive:true });
  window.addEventListener('touchend', onUp);
}

function render() {
  renderTabs();
  const color = TAB_COLORS[activeTab];
  const m = document.getElementById('main');
  m.style.setProperty('--tabColor', color);

  if (activeTab === "Overview") m.innerHTML = overviewView();
  else if (activeTab === "Phase 1") m.innerHTML = phaseView('phase1');
  else if (activeTab === "Phase 2") m.innerHTML = phaseView('phase2');
  else if (activeTab === "Shopping List") m.innerHTML = '<h3 style="margin:4px 0 14px;">Shopping List</h3>' + shoppingListView();
  else if (activeTab === "Budget") m.innerHTML = budgetView();
  else if (activeTab === "Gantt") m.innerHTML = ganttView();
  else if (activeTab === "Calculations") m.innerHTML = calcView();
  else if (activeTab === "Literature") m.innerHTML = literatureView();
  else if (activeTab === "Notes") m.innerHTML = notesView();

  updateFloatingBadge();
  bindEvents();
}

function bindEvents() {
  let dragSource = null;
  document.querySelectorAll('.block[draggable="true"][data-list]').forEach(blk => {
    blk.ondragstart = (e) => {
      dragSource = { list: blk.dataset.list, idx: +blk.dataset.idx };
      blk.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    };
    blk.ondragend = () => { blk.classList.remove('dragging'); dragSource = null; };
    blk.ondragover = (e) => { e.preventDefault(); blk.classList.add('drag-over'); };
    blk.ondragleave = () => { blk.classList.remove('drag-over'); };
    blk.ondrop = (e) => {
      e.preventDefault();
      blk.classList.remove('drag-over');
      if (!dragSource) return;
      const targetList = blk.dataset.list, targetIdx = +blk.dataset.idx;
      if (dragSource.list !== targetList) return;
      const arr = state[targetList];
      const [moved] = arr.splice(dragSource.idx, 1);
      let insertAt = targetIdx;
      if (dragSource.idx < targetIdx) insertAt = targetIdx; else insertAt = targetIdx;
      arr.splice(insertAt, 0, moved);
      save(); render();
    };
  });

  document.querySelectorAll('[data-shoplink]').forEach(inp => {
    inp.oninput = () => {
      state.shopping[+inp.dataset.shoplink].link = inp.value;
      save();
      const item = document.querySelectorAll('.shop-item')[+inp.dataset.shoplink];
      const chk = item.querySelector('.shop-check');
      if (inp.value.trim()) { item.classList.add('sourced'); chk.innerHTML = '&#10003;'; }
      else { item.classList.remove('sourced'); chk.innerHTML = ''; }
    };
  });
  document.querySelectorAll('[data-shopqty]').forEach(inp => {
    inp.oninput = () => { state.shopping[+inp.dataset.shopqty].qty = +inp.value; save(); };
  });
  document.querySelectorAll('[data-shopprice]').forEach(inp => {
    inp.oninput = () => { state.shopping[+inp.dataset.shopprice].price = +inp.value; save(); };
  });
  document.querySelectorAll('[data-shopdel]').forEach(b => {
    b.onclick = () => { state.shopping.splice(+b.dataset.shopdel,1); save(); render(); };
  });
  document.querySelectorAll('[data-shoplog]').forEach(b => {
    b.onclick = () => {
      const i = +b.dataset.shoplog;
      const it = state.shopping[i];
      const qty = it.qty || 1;
      const cost = +it.price || 0;
      const existing = state.budget.findIndex(x => x.item === it.t);
      if (existing >= 0) { state.budget[existing].qty = qty; state.budget[existing].cost = cost; }
      else { state.budget.push({ item: it.t, qty, cost }); }
      save();
      b.textContent = 'Logged \u2713';
      setTimeout(()=>{ b.textContent = 'Log \u2192'; }, 1200);
    };
  });
  const shopAdd = document.getElementById('shop-add');
  if (shopAdd) shopAdd.onclick = () => {
    const input = document.getElementById('add-shop');
    const val = input.value.trim();
    if (!val) return;
    state.shopping.unshift({t: val, qty:1, link:"", price:""});
    save(); render();
  };

  document.querySelectorAll('.block[data-list]').forEach(blk => {
    blk.onclick = (e) => {
      if (e.target.closest('[data-del]')) return;
      const list = blk.dataset.list, idx = +blk.dataset.idx;
      state[list][idx].done = !state[list][idx].done;
      save(); render();
    };
  });
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = (e) => {
      e.stopPropagation();
      const list = b.dataset.list, idx = +b.dataset.idx;
      state[list].splice(idx,1);
      save(); render();
    };
  });
  document.querySelectorAll('[data-addto]').forEach(btn => {
    btn.onclick = () => {
      const key = btn.dataset.addto;
      const input = document.getElementById('add-'+key);
      const catSel = document.getElementById('cat-'+key);
      const val = input.value.trim();
      if (!val) return;
      state[key].push({t: val, done:false, cat: catSel ? catSel.value : CATS[0]});
      save(); render();
    };
  });
  document.querySelectorAll('.del[data-budgetdel]').forEach(b => {
    b.onclick = () => {
      state.budget.splice(+b.dataset.budgetdel, 1);
      save(); render();
    };
  });
  const ganttToggle = document.getElementById('gantt-edit-toggle');
  if (ganttToggle) ganttToggle.onclick = () => { ganttEditMode = !ganttEditMode; render(); };
  document.querySelectorAll('[data-gname]').forEach(inp => {
    inp.oninput = () => { state.ganttTasks[+inp.dataset.gname].name = inp.value; save(); };
  });
  document.querySelectorAll('[data-gstart]').forEach(inp => {
    inp.oninput = () => { state.ganttTasks[+inp.dataset.gstart].start = Math.max(1, Math.min(14, +inp.value||1)); save(); };
  });
  document.querySelectorAll('[data-gend]').forEach(inp => {
    inp.oninput = () => { state.ganttTasks[+inp.dataset.gend].end = Math.max(1, Math.min(14, +inp.value||1)); save(); };
  });
  document.querySelectorAll('[data-gdel]').forEach(b => {
    b.onclick = () => { state.ganttTasks.splice(+b.dataset.gdel,1); save(); render(); };
  });
  const ganttAdd = document.getElementById('gantt-add-task');
  if (ganttAdd) ganttAdd.onclick = () => {
    state.ganttTasks.push({name:'New task', start:1, end:2});
    save(); render();
  };
  const ganttStartInput = document.getElementById('gantt-start-input');
  if (ganttStartInput) ganttStartInput.onchange = () => {
    state.ganttStart = ganttStartInput.value;
    save(); render();
  };

  const sn = document.getElementById('saveNoteBtn');
  if (sn) sn.onclick = () => {
    try {
      const area = document.getElementById('notesArea');
      if (!area) { console.error('notesArea not found'); return; }
      const val = area.value.trim();
      if (!val) return;
      if (editingNoteId) {
        const n = state.notes.find(x=>x.id===editingNoteId);
        if (n) n.text = val;
        editingNoteId = null;
      } else {
        state.notes.unshift({ id: Date.now(), text: val });
      }
      render();
      save().catch(err => console.error('save() rejected:', err));
    } catch (err) {
      console.error('Save note click handler failed:', err);
    }
  };
  const cancelBtn = document.getElementById('cancelEditBtn');
  if (cancelBtn) cancelBtn.onclick = () => { editingNoteId = null; render(); };
  document.querySelectorAll('[data-noteedit]').forEach(b => {
    b.onclick = () => { editingNoteId = +b.dataset.noteedit; render(); };
  });
  document.querySelectorAll('[data-notedel]').forEach(b => {
    b.onclick = () => {
      state.notes = state.notes.filter(n => n.id !== +b.dataset.notedel);
      if (editingNoteId === +b.dataset.notedel) editingNoteId = null;
      save(); render();
    };
  });
  let noteDragSource = null;
  document.querySelectorAll('.note-block[draggable="true"]').forEach(blk => {
    blk.ondragstart = (e) => { noteDragSource = blk.dataset.noteid; blk.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; };
    blk.ondragend = () => { blk.classList.remove('dragging'); noteDragSource = null; };
    blk.ondragover = (e) => { e.preventDefault(); blk.classList.add('drag-over'); };
    blk.ondragleave = () => { blk.classList.remove('drag-over'); };
    blk.ondrop = (e) => {
      e.preventDefault(); blk.classList.remove('drag-over');
      if (!noteDragSource) return;
      const targetId = blk.dataset.noteid;
      if (noteDragSource === targetId) return;
      const fromIdx = state.notes.findIndex(n => String(n.id) === String(noteDragSource));
      const toIdx = state.notes.findIndex(n => String(n.id) === String(targetId));
      if (fromIdx < 0 || toIdx < 0) return;
      const [moved] = state.notes.splice(fromIdx, 1);
      state.notes.splice(toIdx, 0, moved);
      save(); render();
    };
  });

  const calcDocEl = document.getElementById('calcDoc');
  if (calcDocEl) {
    let calcSaveTimer = null;
    calcDocEl.addEventListener('input', () => {
      state.calcDoc = calcDocEl.innerHTML;
      clearTimeout(calcSaveTimer);
      calcSaveTimer = setTimeout(() => save(), 500);
    });
  }
  document.querySelectorAll('.calc-toolbar [data-cmd]').forEach(btn => {
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => {
      try { document.execCommand(btn.dataset.cmd, false, btn.dataset.val || null); } catch (e) {}
      if (calcDocEl) { state.calcDoc = calcDocEl.innerHTML; save(); }
    });
  });
  const insertEqBtn = document.getElementById('insertEqBtn');
  if (insertEqBtn) {
    insertEqBtn.addEventListener('mousedown', (e) => e.preventDefault());
    insertEqBtn.addEventListener('click', () => {
      try { document.execCommand('insertHTML', false, '<div class="eq-block">New equation...</div><p><br></p>'); } catch (e) {}
      if (calcDocEl) { state.calcDoc = calcDocEl.innerHTML; save(); }
    });
  }
  document.querySelectorAll('[data-glossdel]').forEach(b => {
    b.onclick = () => {
      state.calcGlossary = state.calcGlossary.filter(g => g.id !== +b.dataset.glossdel);
      save(); render();
    };
  });
  const glossAdd = document.getElementById('gloss-add');
  if (glossAdd) glossAdd.onclick = () => {
    const labelEl = document.getElementById('gloss-label');
    const valueEl = document.getElementById('gloss-value');
    const label = labelEl.value.trim(), value = valueEl.value.trim();
    if (!label || !value) return;
    state.calcGlossary.push({ id: Date.now(), label, value });
    save(); render();
  };

  const litSave = document.getElementById('saveLitBtn');
  if (litSave) litSave.onclick = () => {
    try {
      const nameEl = document.getElementById('litName');
      const linkEl = document.getElementById('litLink');
      const catEl = document.getElementById('litCategory');
      if (!nameEl) return;
      const name = nameEl.value.trim();
      const link = linkEl ? linkEl.value.trim() : '';
      const category = catEl ? catEl.value : '';
      if (!name) return;
      if (editingLitId) {
        const n = state.literature.find(x=>x.id===editingLitId);
        if (n) { n.name = name; n.link = link; n.category = category; }
        editingLitId = null;
      } else {
        state.literature.unshift({ id: Date.now(), name, link, category });
      }
      render();
      save().catch(err => console.error('save() rejected:', err));
    } catch (err) {
      console.error('Save literature click handler failed:', err);
    }
  };
  const litCancel = document.getElementById('cancelLitEditBtn');
  if (litCancel) litCancel.onclick = () => { editingLitId = null; render(); };
  document.querySelectorAll('[data-litfilter]').forEach(b => {
    b.onclick = () => { litFilter = b.dataset.litfilter; render(); };
  });
  document.querySelectorAll('[data-litedit]').forEach(b => {
    b.onclick = () => { editingLitId = +b.dataset.litedit; render(); };
  });
  document.querySelectorAll('[data-litdel]').forEach(b => {
    b.onclick = () => {
      state.literature = state.literature.filter(n => n.id !== +b.dataset.litdel);
      if (editingLitId === +b.dataset.litdel) editingLitId = null;
      save(); render();
    };
  });
  let litDragSource = null;
  document.querySelectorAll('[data-litid][draggable="true"]').forEach(blk => {
    blk.ondragstart = (e) => { litDragSource = blk.dataset.litid; blk.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; };
    blk.ondragend = () => { blk.classList.remove('dragging'); litDragSource = null; };
    blk.ondragover = (e) => { e.preventDefault(); blk.classList.add('drag-over'); };
    blk.ondragleave = () => { blk.classList.remove('drag-over'); };
    blk.ondrop = (e) => {
      e.preventDefault(); blk.classList.remove('drag-over');
      if (!litDragSource) return;
      const targetId = blk.dataset.litid;
      if (litDragSource === targetId) return;
      const fromIdx = state.literature.findIndex(n => String(n.id) === String(litDragSource));
      const toIdx = state.literature.findIndex(n => String(n.id) === String(targetId));
      if (fromIdx < 0 || toIdx < 0) return;
      const [moved] = state.literature.splice(fromIdx, 1);
      state.literature.splice(toIdx, 0, moved);
      save(); render();
    };
  });
}

load();

setInterval(() => {
  updateFloatingBadge();
  renderDatesPanel();
  const wt = document.querySelector('.week-tracker');
  if (wt && !ganttEditMode) {
    const { weekIndex, dayInWeek, fillFrac } = getWeekInfo();
    const label = wt.querySelector('.wt-label');
    if (label) label.textContent = 'Week ' + (weekIndex+1) + ' of 14 \u00B7 Day ' + (dayInWeek+1) + ' of this week';
    wt.querySelectorAll('.week-seg .fill').forEach((seg,i) => {
      let width = 0;
      if (i < weekIndex) width = 100; else if (i === weekIndex) width = fillFrac*100;
      seg.style.width = width + '%';
    });
  }
}, 60000);
